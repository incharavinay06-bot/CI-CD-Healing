services:
  - type: web
    name: devops-self-healing-portal
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false # You will enter your Gemini API key in the Render Dashboard
